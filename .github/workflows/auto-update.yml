name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate GitHub stats
        run: |
          curl -o profile/stats.svg "https://github-readme-stats-sigma-five.vercel.app/api?username=pgiahuy&show_icons=true&theme=gruvbox&hide_border=true&count_private=true&include_all_commits=true"

      - name: Generate top languages (Including contributions to other repos)
        run: |
          curl -o profile/top-langs.svg "https://metrics.lecoq.io/pgiahuy?plugins.languages=yes&plugins.languages.indepth=yes&plugins.languages.sections=most-used&plugins.languages.details=percentage&plugins.languages.limit=8&plugins.languages.ignored=html,css,jupyter%20notebook&config.base=&config.timezone=Asia/Ho_Chi_Minh"
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Generate streak stats
        run: |
          curl -o profile/streak.svg "https://streak-stats.demolab.com?user=pgiahuy&theme=gruvbox&hide_border=true&count_private=true&include_all_commits=true"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update github stats" || exit 0
          git push
