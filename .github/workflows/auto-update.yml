name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      # All three cards are rendered inside this workflow by lowlighter/metrics instead of third-party services:
      # the public github-readme-stats deployment used before was disabled (HTTP 402). output_action: none only
      # writes the files to /metrics_renders; "Commit changes" pushes them as before.
      - name: Render stats card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pgiahuy
          filename: stats.svg
          output_action: none
          base: activity, community, repositories
          config_timezone: Asia/Ho_Chi_Minh

      - name: Render languages card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pgiahuy
          filename: top-langs.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_limit: 5
          plugin_languages_details: percentage

      - name: Render streak card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pgiahuy
          filename: streak.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Ho_Chi_Minh

      - name: Move rendered cards
        run: sudo mv /metrics_renders/stats.svg /metrics_renders/top-langs.svg /metrics_renders/streak.svg profile/ && sudo chown "$USER" profile/*.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update github stats" && git push || echo "nothing to commit"
